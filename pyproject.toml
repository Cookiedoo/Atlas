[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-research-engine"
version = "0.1.0"
description = "Local-first autonomous research and evolution engine"
requires-python = ">=3.11"

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
include = ["atlas*"]
